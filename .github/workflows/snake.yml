
name: Generate Neon Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate colorful contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: sriinathh
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2367e8f9&color_dots=%230b1020,%23312e81,%237c3aed,%230ea5e9,%2367e8f9
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23f0abfc&color_dots=%230b1020,%23312e81,%237c3aed,%230ea5e9,%2367e8f9

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
